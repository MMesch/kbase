[package]
name = "kbase"
version = "0.1.0"
edition = "2024"
description = "Knowledge graph CLI for markdown notes"

[dependencies]
# RDF triple store
oxigraph = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Utilities
walkdir = "2"
regex = "1"
anyhow = "1"
thiserror = "1"
urlencoding = "2"

# Embeddings
ort = { version = "2.0.0-rc.11", default-features = false, features = ["ndarray", "load-dynamic"] }
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# HTTP client (for Ollama fallback)
ureq = { version = "2", features = ["json"] }
serde_json = "1"

# Embedding cache
redb = "2"
sha2 = "0.10"

# LSP server
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-std", "macros", "sync"] }

# File watching
notify = "8"
notify-debouncer-mini = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

